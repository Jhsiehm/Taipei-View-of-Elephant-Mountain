<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Taipei</title>
<style>
:root{color-scheme:dark;--ground:#05070a;--ink:#f1e6cf;--mute:rgba(241,230,207,.62);--glass:rgba(12,14,13,.58);--line:rgba(241,230,207,.14);--on:#f2b866;--onbg:rgba(242,184,102,.16)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ground);color:var(--ink)}
body{cursor:default;-webkit-tap-highlight-color:transparent;font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body.idle{cursor:none}
canvas{position:absolute;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#stage{position:fixed;inset:0;overflow:hidden;contain:strict}
#glow{left:0;top:0;width:100%;height:100%;transform:scale(1.15);filter:blur(42px) saturate(1.3) brightness(.85);image-rendering:auto;pointer-events:none}
#edgeL,#edgeR{filter:blur(22px) saturate(1.15) brightness(.95);image-rendering:auto;pointer-events:none}
#mirL{-webkit-mask-image:linear-gradient(to left,#000 0,rgba(0,0,0,.85) 35%,transparent 100%);mask-image:linear-gradient(to left,#000 0,rgba(0,0,0,.85) 35%,transparent 100%);pointer-events:none}
#mirR{-webkit-mask-image:linear-gradient(to right,#000 0,rgba(0,0,0,.85) 35%,transparent 100%);mask-image:linear-gradient(to right,#000 0,rgba(0,0,0,.85) 35%,transparent 100%);pointer-events:none}
#scene{touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 55%,rgba(0,0,0,.34) 100%)}
#ui{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(860px,calc(100vw - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));
  background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:9px;
  transition:opacity .6s ease,transform .6s ease;max-height:calc(70vh - env(safe-area-inset-bottom,0px));overflow-y:auto;box-sizing:border-box}
#ui.off{opacity:0;transform:translate(-50%,12px);pointer-events:none}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.lab{flex:0 0 64px;color:var(--mute);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;border-radius:999px;padding:0 12px;height:34px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:rgba(241,230,207,.32)}
.chip:focus-visible{outline:2px solid var(--on);outline-offset:2px}
.chip[aria-pressed=true]{background:var(--onbg);border-color:rgba(242,184,102,.55);color:var(--on)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--mute);font-size:10.5px;letter-spacing:.06em}
#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 20px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);color:var(--ink);letter-spacing:.14em;text-transform:lowercase;pointer-events:none;transition:opacity 1s}
#start.off{opacity:0}
@media (max-width:640px){
  #ui{bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:10px 10px;gap:8px;border-radius:12px}
  .row{flex-direction:column;align-items:flex-start;gap:5px}
  .lab{flex:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{height:38px;padding:0 13px}
  .foot .keys{display:none}
}
#menuBtn{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:opacity .6s ease;padding:0}
#menuBtn:hover{border-color:rgba(241,230,207,.35)}
#menuBtn:focus-visible{outline:2px solid var(--on);outline-offset:2px;opacity:1}
#menuBtn[aria-expanded=true]{color:var(--on);border-color:rgba(242,184,102,.55)}
#menuBtn.off{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#ui,#start,#menuBtn{transition:none}}
</style>
</head>
<body>
<div id="stage">
<canvas id="glow" width="40" height="44" aria-hidden="true"></canvas>
<canvas id="mirL" aria-hidden="true"></canvas>
<canvas id="mirR" aria-hidden="true"></canvas>
<canvas id="scene" width="948" height="1024" aria-label="Taipei 101 seen through leaves, slowly passing through day and night"></canvas>
<canvas id="edgeL" width="6" height="64" aria-hidden="true"></canvas>
<canvas id="edgeR" width="6" height="64" aria-hidden="true"></canvas>
</div>
<div id="vig"></div>
<div id="start">tap to begin</div>
<button id="menuBtn" class="off" aria-label="Scene settings" aria-expanded="false" aria-controls="ui"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
<div id="ui" class="off" role="region" aria-label="Scene settings">
  <div class="row"><span class="lab">Time</span><div class="chips" id="c-time">
    <button class="chip" data-v="auto">Auto cycle</button><button class="chip" data-v="dawn">Dawn</button><button class="chip" data-v="day">Day</button>
    <button class="chip" data-v="golden">Golden hour</button><button class="chip" data-v="blue">Blue hour</button><button class="chip" data-v="night">Night</button><button class="chip" data-v="local">My local time</button></div></div>
  <div class="row"><span class="lab">Weather</span><div class="chips" id="c-weather">
    <button class="chip" data-v="auto">Changing</button><button class="chip" data-v="clear">Clear</button><button class="chip" data-v="rain">Rain</button></div></div>
  <div class="row"><span class="lab">Scene</span><div class="chips" id="c-scene">
    <button class="chip" data-v="illustrated">Illustrated</button><button class="chip" data-v="faithful">Photo study</button></div></div>
  <div class="row"><span class="lab">View</span><div class="chips" id="c-view">
    <button class="chip" data-v="immersive">Immersive</button><button class="chip" data-v="whole">Whole picture</button><button class="chip" data-v="fill">Close-up</button>
    <button class="chip" id="b-sound" aria-pressed="false">Sound</button><button class="chip" id="b-fs" aria-pressed="false">Fullscreen</button></div></div>
  <div class="foot"><span id="status">golden hour</span><span class="keys">tap the scene for a gust · o menu · space pause · f fullscreen · m sound</span></div>
</div>
<script>/*ASSETS*/</script>
<script>/*ENGINE*/</script>
<script>
(function () {
  'use strict';
  var W = 948, H = 1024;
  var $ = function (id) { return document.getElementById(id); };
  var cv = $('scene'), glow = $('glow'), gctx = glow.getContext('2d'), mirL = $('mirL'), mirR = $('mirR');
  var edgeL = $('edgeL'), edgeR = $('edgeR'), elx = edgeL.getContext('2d'), erx = edgeR.getContext('2d');
  var lctx = mirL.getContext('2d'), rctx = mirR.getContext('2d'), ui = $('ui'), startEl = $('start'), statusEl = $('status');
  var Q = new URLSearchParams(location.search), SPEED = +(Q.get('speed') || 1);
  var world = null, started = false, t0 = performance.now(), lastFrame = performance.now();

  // ---------- saved choices ----------
  var prefs = { time: 'auto', weather: 'auto', scene: 'illustrated', view: 'immersive' };
  try { var sv = JSON.parse(localStorage.getItem('taipei-immersive') || 'null'); if (sv) for (var k in prefs) if (sv[k]) prefs[k] = sv[k]; } catch (e) {}
  ['time', 'weather', 'scene', 'view'].forEach(function (k) { if (Q.get(k)) prefs[k] = Q.get(k); });
  function save() { try { localStorage.setItem('taipei-immersive', JSON.stringify(prefs)); } catch (e) {} }

  // ---------- framing ----------
  // immersive: crop at most ~22% of the height (keeps canopy + railing), and extend the sides with a
  // mirrored continuation of the live scene that dissolves into a soft colour field. Portrait screens
  // crop the sides instead (the composition lives in the centre), so phones fill edge to edge.
  var FOCUS = { illustrated: [548, 520], faithful: [466, 560] };
  var geo = { s: 1, x: 0, y: 0, cw: W, ch: H, side: 0 }, edgeTick = 0;
  function layout() {
    var vw = document.documentElement.clientWidth || innerWidth, vh = document.documentElement.clientHeight || innerHeight;
    var contain = Math.min(vw / W, vh / H), cover = Math.max(vw / W, vh / H), s;
    if (prefs.view === 'whole') s = contain;
    else if (prefs.view === 'fill') s = cover;
    else s = Math.min(cover, Math.max(contain, Math.min(vh / (H * 0.72), vw / (W * 0.45))));
    var cw = W * s, ch = H * s, f = FOCUS[world ? world.mode : prefs.scene];
    var x = vw / 2 - f[0] * s, y = vh / 2 - f[1] * s;
    x = cw <= vw ? (vw - cw) / 2 : Math.min(0, Math.max(vw - cw, x));
    y = ch <= vh ? (vh - ch) / 2 : Math.min(0, Math.max(vh - ch, y));
    // immersive keeps the ground, bushes and path: any vertical crop comes off the top of the canopy
    if (prefs.view === 'immersive' && ch > vh) y = vh - ch;
    x = Math.round(x); y = Math.round(y);
    geo = { s: s, x: x, y: y, cw: cw, ch: ch, side: Math.max(0, Math.ceil(x)) };
    place(cv, x, y, cw, ch);
    var side = geo.side;
    mirL.style.display = mirR.style.display = 'none';
    if (side > 0) {
      // sides: the edge columns' own colours, stretched and softened, feathered over the scene's edge
      var pad = 60, fe = Math.round(Math.min(48, side * 0.5));
      place(edgeL, -pad, y - pad, x + pad + fe, ch + pad * 2);
      place(edgeR, x + cw - fe, y - pad, vw - x - cw + pad + fe, ch + pad * 2);
      var mL = 'linear-gradient(to right,#000 calc(100% - ' + (fe * 2) + 'px),transparent 100%)';
      var mR = 'linear-gradient(to left,#000 calc(100% - ' + (fe * 2) + 'px),transparent 100%)';
      edgeL.style.webkitMaskImage = edgeL.style.maskImage = mL; edgeR.style.webkitMaskImage = edgeR.style.maskImage = mR;
      edgeL.style.display = edgeR.style.display = 'block';
    } else edgeL.style.display = edgeR.style.display = 'none';
  }
  function place(el, x, y, w, h) { el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px'; }
  addEventListener('resize', layout);
  function paintEdges() {
    if (geo.side > 0) {
      if ((++edgeTick % 4) === 0) {
        elx.drawImage(cv, 0, 0, 70, H, 0, 0, 6, 64);
        erx.drawImage(cv, W - 70, 0, 70, H, 0, 0, 6, 64);
      }
    }
    gctx.drawImage(cv, 0, 0, 40, 44);
  }

  // ---------- time of day ----------
  var FIXED = { day: 0, golden: 1, dawn: 1.55, blue: 2, night: 3 };
  var NAMES = { auto: 'auto cycle', dawn: 'dawn', day: 'day', golden: 'golden hour', blue: 'blue hour', night: 'night', local: 'local time' };
  // auto cycle (~10 min): [mood, hold s, blend s]
  var DAY = [[1, 75, 45], [2, 45, 45], [3, 110, 45], [2, 35, 40], [1.55, 40, 30], [1, 35, 40], [0, 80, 50]];
  var DAY_LEN = DAY.reduce(function (a, d) { return a + d[1] + d[2]; }, 0);
  function ease(x) { return x * x * (3 - 2 * x); }
  function moodAuto(sec) {
    var u = ((sec % DAY_LEN) + DAY_LEN) % DAY_LEN;
    for (var i = 0; i < DAY.length; i++) {
      var d = DAY[i], n = DAY[(i + 1) % DAY.length];
      if (u < d[1]) return d[0]; u -= d[1];
      if (u < d[2]) return d[0] + (n[0] - d[0]) * ease(u / d[2]); u -= d[2];
    }
    return 1;
  }
  function moodLocal(date) {
    var h = date.getHours() + date.getMinutes() / 60 + date.getSeconds() / 3600;
    var k = [[0, 3], [4.6, 3], [5.4, 2], [6.0, 1.55], [6.6, 1], [8, 0], [16.6, 0], [18.2, 1], [19.2, 2], [20.3, 3], [24, 3]];
    for (var i = 0; i < k.length - 1; i++) if (h >= k[i][0] && h < k[i + 1][0]) return k[i][1] + (k[i + 1][1] - k[i][1]) * ease((h - k[i][0]) / (k[i + 1][0] - k[i][0]));
    return 3;
  }
  function moodName(m) { return m < 0.5 ? 'day' : m < 1.3 ? 'golden hour' : m < 1.8 ? 'dawn / dusk' : m < 2.5 ? 'blue hour' : 'night'; }

  function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function noise1(x) { var i = Math.floor(x), f = x - i; f = f * f * (3 - 2 * f); return hash(i) * (1 - f) + hash(i + 1) * f; }

  var nextGust = 8, rainUntil = -1, nextWeather = 90, lastPointer = 0, autoBase = 0;
  function direct() {
    if (!world) return;
    var now = performance.now(), dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
    var sec = (now - t0) / 1000 * SPEED;
    var target = prefs.time === 'auto' ? moodAuto(sec - autoBase) : prefs.time === 'local' ? moodLocal(new Date()) : FIXED[prefs.time];
    world.mood += (target - world.mood) * (1 - Math.exp(-dt * SPEED / 2.2));
    // weather
    if (prefs.weather === 'auto' && sec > nextWeather) {
      nextWeather = sec + 150 + hash(Math.floor(sec)) * 150;
      if (rainUntil < sec && hash(Math.floor(sec) + 7) < 0.38) rainUntil = sec + 70 + hash(Math.floor(sec) + 3) * 80;
    }
    var wantRain = prefs.weather === 'rain' || (prefs.weather === 'auto' && sec < rainUntil);
    if (world.rain !== wantRain) world.setRain(wantRain);
    // wind and wandering gusts
    var wnd = 0.28 + 0.38 * noise1(sec / 40) + 0.18 * noise1(sec / 9 + 50) + (world.rain ? 0.15 : 0);
    world.wind = Math.max(0.1, Math.min(1, wnd));
    if (sec > nextGust) {
      var r1 = hash(Math.floor(sec * 3.1)), r2 = hash(Math.floor(sec * 5.7) + 1);
      var at = r1 < 0.5 ? [40 + r2 * 300, 120 + r2 * 700] : [600 + r2 * 340, 100 + r2 * 800];
      world.gust(at[0], at[1], 0.55 + 0.6 * hash(Math.floor(sec) + 9));
      nextGust = sec + (10 + 22 * hash(Math.floor(sec) + 11)) / (world.rain ? 1.6 : 1);
    }
    if (now - lastPointer > 4000) world.setPointer(Math.sin(sec / 23) * 0.55, Math.sin(sec / 31 + 1) * 0.35);
    paintEdges();
    statusEl.textContent = (prefs.time === 'auto' ? 'auto cycle · ' : prefs.time === 'local' ? 'local time · ' : '') + moodName(world.mood) + (world.rain ? ' · rain' : '');
  }

  // ---------- menu ----------
  function sync() {
    [['c-time', 'time'], ['c-weather', 'weather'], ['c-scene', 'scene'], ['c-view', 'view']].forEach(function (p) {
      [].forEach.call($(p[0]).querySelectorAll('[data-v]'), function (b) { b.setAttribute('aria-pressed', b.dataset.v === prefs[p[1]]); });
    });
    $('b-sound').setAttribute('aria-pressed', !!(world && world.audio.on));
    $('b-fs').setAttribute('aria-pressed', !!document.fullscreenElement);
  }
  function pick(group, key) {
    $(group).addEventListener('click', function (e) {
      var b = e.target.closest('[data-v]'); if (!b) return;
      prefs[key] = b.dataset.v; save();
      if (key === 'scene' && world) world.setMode(prefs.scene);
      if (key === 'time' && prefs.time === 'auto' && world) {
        // start the cycle from whatever light is showing now
        var sec = (performance.now() - t0) / 1000 * SPEED, best = 0, bd = 9;
        for (var s = 0; s < DAY_LEN; s += 2) { var d = Math.abs(moodAuto(s) - world.mood); if (d < bd) { bd = d; best = s; } }
        autoBase = sec - best;
      }
      if (key === 'weather') rainUntil = -1;
      if (key === 'view' || key === 'scene') layout();
      sync(); wake();
    });
  }
  pick('c-time', 'time'); pick('c-weather', 'weather'); pick('c-scene', 'scene'); pick('c-view', 'view');
  $('b-sound').onclick = function () { if (world) world.setAudio(!world.audio.on); sync(); };
  $('b-fs').onclick = toggleFS;
  function toggleFS() {
    var d = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) d.requestFullscreen().catch(function () {});
  }
  document.addEventListener('fullscreenchange', function () { sync(); setTimeout(layout, 50); });

  // The settings menu only opens from its own button. The button itself stays out of sight until the
  // pointer moves or the screen is tapped, then fades away again after a few seconds.
  var btn = $('menuBtn'), idle = null, menuOpen = false;
  function setMenu(open) {
    menuOpen = open; ui.classList.toggle('off', !open); btn.setAttribute('aria-expanded', open);
    if (open) sync(); wake();
  }
  function wake() {
    document.body.classList.remove('idle'); btn.classList.remove('off');
    clearTimeout(idle);
    idle = setTimeout(function () { if (menuOpen) return; document.body.classList.add('idle'); btn.classList.add('off'); }, 3000);
  }
  btn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  btn.addEventListener('click', function (e) { e.stopPropagation(); setMenu(!menuOpen); });
  ui.addEventListener('pointerdown', function (e) { e.stopPropagation(); wake(); });

  addEventListener('pointermove', function (e) {
    if (e.pointerType === 'mouse') { lastPointer = performance.now(); wake(); }
    if (world && e.pointerType === 'mouse') world.setPointer((e.clientX / innerWidth) * 2 - 1, (e.clientY / innerHeight) * 2 - 1);
  });
  addEventListener('pointerdown', function (e) {
    if (!world) return;
    if (!started) {
      started = true; startEl.classList.add('off');
      world.setAudio(true);
      if (e.pointerType === 'mouse') toggleFS();
      sync(); wake(); return;
    }
    if (menuOpen) { setMenu(false); return; }   // a click outside the open menu just closes it
    wake();
    var r = cv.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width * W, py = (e.clientY - r.top) / r.height * H;
    world.gust(Math.max(0, Math.min(W, px)), Math.max(0, Math.min(H, py)), 1);
  });
  addEventListener('keydown', function (e) {
    if (!world) return; var k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); world.togglePlay(); }
    else if (k === 'f') toggleFS();
    else if (k === 'm') { world.setAudio(!world.audio.on); sync(); }
    else if (k === 'escape') { if (menuOpen) setMenu(false); }
    else if (k === 'o') setMenu(!menuOpen);
    else return;
    if (!started) { started = true; startEl.classList.add('off'); }
    wake();
  });
  document.addEventListener('visibilitychange', function () {
    if (world && world.audio.on && world.audio.ctx) { if (document.hidden) world.audio.ctx.suspend(); else world.audio.ctx.resume(); }
  });

  var initMood = prefs.time === 'local' ? moodLocal(new Date()) : prefs.time === 'auto' ? 1 : FIXED[prefs.time];
  TaipeiWorld.create(cv, { mode: prefs.scene, mood: initMood, wind: 0.4, vignette: 0 }).then(function (w) {
    world = w; window.world = w; layout(); sync();
    setTimeout(function () { if (!started) startEl.classList.add('off'); }, 6000);
    (function loop() { direct(); requestAnimationFrame(loop); })();
  }).catch(function (e) { console.error(e); });
  layout(); sync();
})();
</script>
</body>
</html>
